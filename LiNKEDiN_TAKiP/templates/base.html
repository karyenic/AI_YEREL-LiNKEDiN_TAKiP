<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>{% block title %}LinkedIn Takip{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="topbar">
  <div class="brand">📊 LinkedIn Takip Asistanı</div>
  <div class="links">
    <a href="/">Adaylar</a>
    <a href="/chat">AI Asistan</a>
    <a href="/metrics">Raporlama</a>
    <a href="/api/excel/export" class="btn-export">⬇ Excel İndir</a>
    <span id="cpu-badge" class="pill pill-mini">CPU --%</span>
    <span id="gpu-badge" class="pill pill-mini">GPU --</span>
    <span id="ollama-pill" class="pill pill-warn">⏳ Ollama</span>
    <button onclick="sistemKapat()" class="btn-cikis">🔴 ÇIKIŞ</button>
  </div>
</nav>
<main>
{% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
