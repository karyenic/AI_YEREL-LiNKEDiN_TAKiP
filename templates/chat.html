{% extends "base.html" %}

{% block title %}AI Asistan{% endblock %}

{% block content %}

<section class="panel chat-panel">

  <div class="chat-header">

    <h2>💬 AI Asistan</h2>

    <div class="chat-controls">
      <select id="model-select"></select>

      <button onclick="chatTemizle()">
        🧹 Temizle
      </button>
    </div>

  </div>

  <div id="chat-messages" class="chat-messages"></div>

  <div class="chat-input">

    <textarea
      id="chat-input"
      placeholder="Veritabanına bir şeyler sor... (Enter = gönder, Shift+Enter = yeni satır)"
      rows="1"
      autofocus></textarea>

    <button onclick="chatGonder()" class="btn-gonder">
      Gönder
    </button>

  </div>

</section>

{% endblock %}
